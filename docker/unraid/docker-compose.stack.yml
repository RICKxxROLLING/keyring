# Paste into Unraid: Docker -> Compose -> Add New Stack -> Edit Stack.
#
# This stack PULLS a prebuilt image from GitHub Container Registry rather than
# building from source on your server. That is what makes Compose Manager's
# "check for updates" meaningful: a locally-built tag has no registry to compare
# against, so the plugin always reported "latest" and never offered an update.
#
# To update now: Compose Manager -> check for updates -> update. No terminal,
# no git pull, no multi-minute native build on the array.
#
# The image is published by .github/workflows/publish.yml on every push to
# main, for linux/amd64 and linux/arm64.
#
# ONE-TIME SETUP: after the first workflow run, make the package public at
#   github.com/users/RICKxxROLLING/packages/container/keyring/settings
# ("Change visibility" -> Public). Otherwise your server has to authenticate to
# GHCR to pull it. The repo being public does NOT make the package public —
# they are separate settings, and this catches most people out.
#
# The service is named `keyring`. If you are migrating from the `stoop` stack,
# remove the old container once this one is healthy.

services:
  keyring:
    image: ghcr.io/rickxxrolling/keyring:latest
    # Always check the registry on `up`, so an update actually replaces the
    # image rather than reusing a stale local copy.
    pull_policy: always
    container_name: keyring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/New_York}
    ports:
      # KEYRING_PORT is the current name; STOOP_PORT is honoured as a fallback
      # so a .env written before the rename keeps working. Set either one.
      #
      # This must match the port inside APP_ORIGIN. They are independent
      # settings and nothing warns you: change one and the page silently stops
      # answering while the container still reports healthy.
      - "${KEYRING_PORT:-${STOOP_PORT:-8088}}:8080"
    volumes:
      # Everything persistent: the database, uploads, backups, setup token.
      - ${KEYRING_DATA_DIR:-${STOOP_DATA_DIR:-/mnt/user/appdata/keyring/data}}:/data
    healthcheck:
      test: ["CMD", "node", "/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------------
  # Uncomment once the app works on your LAN and you have a tunnel token.
  # Two stages means a failure tells you whether it was the app or Cloudflare.
  #
  # Before uncommenting, set in .env:
  #   TUNNEL_TOKEN   your Cloudflare tunnel connector token
  #   APP_ORIGIN     the https:// hostname, exactly — it gates Secure cookies
  #                  and the WebSocket origin check, and a mismatch shows up as
  #                  login loops rather than an obvious error
  # ---------------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: keyring-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
  #   depends_on:
  #     keyring:
  #       condition: service_healthy

# ---------------------------------------------------------------------------
# BUILDING FROM SOURCE INSTEAD
#
# If you want to run a local change without pushing it, or GHCR is unreachable,
# replace the image/pull_policy lines above with a build context and run
# `docker compose up -d --build`:
#
#   keyring:
#     build:
#       context: ${KEYRING_SRC:-/mnt/user/appdata/keyring/src}
#     image: keyring:local
#
# Note the different tag. Tagging a local build `ghcr.io/...:latest` makes the
# next registry pull look like a downgrade and gets confusing fast.
# ---------------------------------------------------------------------------
