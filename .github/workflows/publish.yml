# Test, build and publish the Keyring image to GitHub Container Registry.
#
# Why this exists: without it, the Unraid stack builds from source on the
# server. That means every update is `git pull` + `docker compose up --build`
# in a terminal, a multi-minute native build on the box, and — most annoyingly
# — Compose Manager's "check for updates" always reports "latest", because a
# locally-built tag has no registry to compare against.
#
# Two channels, one per branch:
#
#   test  → :test    what the keyring-test stack on the server follows
#   main  → :latest  what production follows
#
# The intended path for a change is test first, then main:
#
#   1. push to `test`            → checks pass → image built → :test + :sha-<commit>
#   2. update the keyring-test stack, try it on real hardware with demo data
#   3. fast-forward main to it   → checks pass → :latest is POINTED AT :sha-<commit>
#
# Step 3 does not rebuild. Main fast-forwarded to a tested commit has the same
# SHA, the image for that SHA already exists, and it is promoted by retagging —
# so production runs the byte-for-byte image that was tried on the test server,
# not a fresh build of the same source that merely ought to be identical.
# A commit that reaches main without going through test (a hotfix, a merge
# commit) has no image yet and is built as before.
#
# Nothing is published unless lint, typecheck and the test suite pass first.

name: Publish image

on:
  push:
    branches: [main, test]
    # Skip the build for changes that cannot affect the image.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".crew/**"
  workflow_dispatch: # lets you rebuild by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # One publish per branch at a time; a newer push supersedes a queued one.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and test
        run: npm run check

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version's ordinal counts that day's commits,
          # and the default shallow clone has exactly one, so every build
          # would call itself .01.
          fetch-depth: 0

      # Both platforms are built because Unraid runs on x86_64 in the vast
      # majority of cases but not all. amd64 builds natively; arm64 is emulated
      # via QEMU, which is acceptable here because the two native modules
      # (better-sqlite3, sharp) ship prebuilt binaries for both architectures —
      # npm downloads them rather than compiling, so emulation only slows the
      # JS build steps.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically

      - name: Pick the channel
        id: channel
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          case "${GITHUB_REF_NAME}" in
            main) tag=latest ;;
            test) tag=test ;;
            *) echo "::error::No channel for branch ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha_ref=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Promotion: main pointing at a commit that was already built for test.
      - name: Look for an image already built from this commit
        id: existing
        if: github.ref_name == 'main'
        run: |
          if docker buildx imagetools inspect "${{ steps.channel.outputs.sha_ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Promoting the tested image ${{ steps.channel.outputs.sha_ref }} — no rebuild."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No image for this commit yet (it did not go through test) — building."
          fi

      - name: Promote it to latest
        if: steps.existing.outputs.found == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.channel.outputs.image }}:latest" \
            "${{ steps.channel.outputs.sha_ref }}"

      - name: Derive version
        id: version
        if: steps.existing.outputs.found != 'true'
        run: echo "value=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        if: steps.existing.outputs.found != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.channel.outputs.tag }}
            type=sha,format=long
          # The channel tag is what a stack follows; the sha tag is what gets
          # promoted, and something specific to roll back to.

      - name: Build and push
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache, so a docs-only or one-file change
          # does not redo npm ci from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
