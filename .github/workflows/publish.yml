# Build and publish the Keyring image to GitHub Container Registry.
#
# Why this exists: without it, the Unraid stack builds from source on the
# server. That means every update is `git pull` + `docker compose up --build`
# in a terminal, a multi-minute native build on the box, and — most annoyingly
# — Compose Manager's "check for updates" always reports "latest", because a
# locally-built tag has no registry to compare against.
#
# With a published image the stack pulls instead of builds, so the plugin's
# update check is meaningful and its update button does the whole job.

name: Publish image

on:
  push:
    branches: [main]
    # Skip the build for changes that cannot affect the image.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".crew/**"
  workflow_dispatch: # lets you rebuild by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # Both platforms are built because Unraid runs on x86_64 in the vast
      # majority of cases but not all. amd64 builds natively; arm64 is emulated
      # via QEMU, which is acceptable here because the two native modules
      # (better-sqlite3, sharp) ship prebuilt binaries for both architectures —
      # npm downloads them rather than compiling, so emulation only slows the
      # JS build steps.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          # `latest` is what the Unraid stack follows; the sha tag gives you
          # something specific to roll back to.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache, so a docs-only or one-file change
          # does not redo npm ci from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
