services:
  keyring:
    build:
      # Defaults to "." so `docker compose up -d --build` works from a checkout.
      # Unraid's Docker Compose Manager keeps stacks on the FLASH drive
      # (/boot/config/plugins/compose.manager/projects/<name>/), which is small,
      # slow and should not be a build context — so point KEYRING_SRC at the
      # source on your array instead. See docs/UNRAID.md.
      context: ${KEYRING_SRC:-.}
    image: keyring:latest
    container_name: keyring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Keep the container clock/log timestamps aligned with APP_TIMEZONE.
      TZ: ${APP_TIMEZONE:-America/New_York}
    ports:
      # Optional — the Cloudflare Tunnel does NOT require a published port at
      # all (cloudflared dials out; nothing needs to be forwarded in). Keep
      # this only if you also want LAN access without going through the
      # tunnel. Comment it out (or set KEYRING_PORT to nothing meaningful) for a
      # tunnel-only deployment with zero exposed host ports.
      - "${KEYRING_PORT:-8080}:8080"
    volumes:
      # ALL persistent state lives under this one bind mount:
      # keyring.db*, uploads/, backups/, setup-token.txt.
      - ${KEYRING_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "node", "/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: keyring-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      keyring:
        condition: service_healthy
